services:

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=myuser         
      - POSTGRES_PASSWORD=mypassword  
      - POSTGRES_DB=mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile
    image: backend-app:latest
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydatabase
      - REDIS_URL=redis://redis:6379
      - SEED_PRODUCTS=true 
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrations:
    build:
      context: .
      dockerfile: backend/dockerfile
    image: backend-app:latest
    command: npx prisma migrate deploy --schema ./prisma/schema.prisma    
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydatabase
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_BASE_URL=http://localhost:3001
        - NEXT_PUBLIC_BACKEND_DOCKER_INTERNAL_URL=http://backend:3001
        - NEXT_PUBLIC_DOCKER_ENV=true
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy


volumes:
  postgres_data: