services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: backend-app:latest
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    networks:
      - shoppi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
       # - NEXT_PUBLIC_BACKEND_BASE_URL=https://api.shoppi.lat
        - NEXT_PUBLIC_BACKEND_BASE_URL=http://localhost:3001
        - NEXT_PUBLIC_DOCKER_ENV=true
        - NEXT_PUBLIC_DOMAIN=https://shoppi.lat/
        - NEXT_PUBLIC_DOMAIN_NAME=shoppi
        - BACKEND_DOCKER_INTERNAL_URL=http://backend:3001
        - NEXT_PUBLIC_STRIPE_ENV=testing
    environment:
      - BACKEND_DOCKER_INTERNAL_URL=http://backend:3001
      - NEXT_PUBLIC_DOCKER_ENV=true
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - shoppi-network

  proxy:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    environment:
      - FRONTEND_DOMAIN=shoppi.lat
      - BACKEND_DOMAIN=api.shoppi.lat
    ports:
      - "443:443"
    networks:
      - shoppi-network

networks:
  shoppi-network:
    driver: bridge