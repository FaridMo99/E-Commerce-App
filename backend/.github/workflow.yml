name: Seed Admin Account and Currency

on:
  push:
    branches:
      - main

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Seed Script
        run: NODE_OPTIONS='--loader ts-node/esm' npx ts-node scripts/seed-admin.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_COUNTRYCODE: ${{ secrets.ADMIN_COUNTRYCODE }}
          ADMIN_CURRENCY: ${{ secrets.ADMIN_CURRENCY }}
          BASE_CURRENCY: ${{ secrets.BASE_CURRENCY }}