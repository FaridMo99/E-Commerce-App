name: Backend Pipeline

on:
  push:
    branches: [main]
    paths: ['backend/**', 'shared/**', '.github/workflows/backend-pipeline.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'shared/**']

permissions:
  id-token: write
  contents: read

jobs:
  # CI
  install-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=./backend/prisma/schema.prisma

      - name: Push Database Schema (Test DB)
        run: npx prisma db push --schema=./backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db

      - name: Audit Dependencies
        run: npm audit --audit-level=high -w backend

      - name: Linting
        run: npm run lint -w backend

      - name: Build Shared Package
        run: npm run build -w shared

      - name: Run Tests
        run: npm run test -w backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: testAccessTokenSecret123
          JWT_REFRESH_SECRET: testRefreshTokenSecret123
          OPEN_EXCHANGE_RATE_APP_KEY: ${{ secrets.OPEN_EXCHANGE_RATE_APP_KEY }}
          CLOUDFLARE_SECRET_KEY: ${{ secrets.CLOUDFLARE_SECRET_KEY }}

  # CD
  deploy:
    runs-on: ubuntu-latest
    needs: install-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          target: runner 
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/shoppi-backend:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/shoppi-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ECS Service
        run: aws ecs update-service --cluster shoppi-cluster --service shoppi-app --force-new-deployment