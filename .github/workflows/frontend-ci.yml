name: Frontend Continous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Audit Dependencies
        run: npm audit -w frontend
      
      - name: Install dependencies
        run: npm ci

      - name: Linting check
        run: npm run lint -w frontend

      - name: Type check
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test -w frontend

      - name: Production Build
        run: npm run build -w frontend

        env:
          NEXT_PUBLIC_BACKEND_BASE_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_BASE_URL }}
          NEXT_PUBLIC_STRIPE_ENV: ${{ secrets.NEXT_PUBLIC_STRIPE_ENV }}

