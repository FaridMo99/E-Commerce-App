name: Backend Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-and-test:
    runs-on: ubuntu-latest

    # 1. Spin up the Database and Redis containers
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci

      # 2. Generate Prisma Client (Fixes the "Cannot find module" error)
      - name: Generate Prisma Client
        run: npx prisma generate --schema=./backend/prisma/schema.prisma

      # 3. Apply Migrations (Fixes the "Table does not exist" error)
      - name: Push Database Schema
        run: npx prisma db push --schema=./backend/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db

      - name: Audit Dependencies
        run: npm audit -w backend

      - name: Linting
        run: npm run lint -w backend

      - name: Build Shared Package
        run: npm run build -w shared

      - name: Run Tests
        run: npm run test -w backend
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Production Build
        run: npm run build -w backend